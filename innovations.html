<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Our innovations — Touchbase</title>
    <meta
      name="description"
      content="RCS messaging, voice-controlled AI, centralised communications and an AI receptionist — the latest Touchbase innovations for Canadian real estate."
    />
    <link rel="icon" href="assets/logo-touchbase.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body data-page="innovations">
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="page innov">
      <div data-layout="header"></div>

      <main id="main">
        <!-- ================= Héros ================= -->
        <section class="innov-hero" aria-labelledby="page-title">
          <div class="innov-hero__text">
            <h1 class="innov-hero__title" id="page-title" data-i18n="innov.title"></h1>
            <div class="innov-hero__lead">
              <p data-i18n="innov.lead1"></p>
              <p data-i18n="innov.lead2"></p>
            </div>
          </div>

          <!-- Un bouton et non une image cliquable : il annonce ce qu'il déclenche. -->
          <button class="video-thumb innov-hero__video" type="button" data-i18n-aria-label="innov.videoCta" aria-label="Play the video">
            <img class="video-thumb__img" src="assets/img/innov/hero-video.jpg" alt="" aria-hidden="true" />
            <img class="video-thumb__play" src="assets/icons/play.svg" alt="" aria-hidden="true" />
          </button>
        </section>

        <div class="innov-main">
          <div class="innov-section-header">
            <p class="innov-section-header__eyebrow" data-i18n="innov.eyebrow"></p>
            <h2 class="innov-section-header__title" data-i18n="innov.sectionTitle"></h2>
          </div>

          <!-- ================= RCS ================= -->
          <article class="innov-card">
            <div class="innov-card__body">
              <h3 class="innov-card__title" data-i18n="innov.rcs.title"></h3>
              <p class="innov-card__text" data-i18n="innov.rcs.text"></p>
              <ul class="innov-card__points">
                <li data-i18n="innov.rcs.p1"></li>
                <li data-i18n="innov.rcs.p2"></li>
                <li data-i18n="innov.rcs.p3"></li>
              </ul>
              <a class="btn btn--navy innov-card__cta" href="contact.html" data-i18n="innov.more"></a>
            </div>
            <div class="innov-card__media">
              <img src="assets/img/innov/rcs.jpg" data-i18n-alt="innov.rcs.alt" alt="" />
            </div>
          </article>

          <!-- ================= Touchbase Live ================= -->
          <article class="innov-card">
            <div class="innov-card__body">
              <h3 class="innov-card__title" data-i18n="innov.live.title"></h3>
              <p class="innov-card__text" data-i18n="innov.live.text"></p>
              <ul class="innov-card__points">
                <li data-i18n="innov.live.p1"></li>
                <li data-i18n="innov.live.p2"></li>
                <li data-i18n="innov.live.p3"></li>
              </ul>
              <a class="btn btn--navy innov-card__cta" href="contact.html" data-i18n="innov.more"></a>
            </div>
            <div class="innov-card__media">
              <img src="assets/img/innov/live.jpg" data-i18n-alt="innov.live.alt" alt="" />
            </div>
          </article>

          <!-- ================= Automaton ================= -->
          <article class="innov-card">
            <div class="innov-card__body">
              <h3 class="innov-card__title" data-i18n="innov.automaton.title"></h3>
              <p class="innov-card__text" data-i18n="innov.automaton.text"></p>
              <ul class="innov-card__points">
                <li data-i18n="innov.automaton.p1"></li>
                <li data-i18n="innov.automaton.p2"></li>
                <li data-i18n="innov.automaton.p3"></li>
              </ul>
              <a class="btn btn--navy innov-card__cta" href="contact.html" data-i18n="innov.more"></a>
            </div>
            <div class="innov-card__media">
              <img src="assets/img/innov/automaton.jpg" data-i18n-alt="innov.automaton.alt" alt="" />
            </div>
          </article>

          <!-- ================= Réceptionniste IA ================= -->
          <article class="innov-card">
            <div class="innov-card__body">
              <h3 class="innov-card__title" data-i18n="innov.reception.title"></h3>
              <p class="innov-card__text" data-i18n="innov.reception.text"></p>
              <ul class="innov-card__points">
                <li data-i18n="innov.reception.p1"></li>
                <li data-i18n="innov.reception.p2"></li>
                <li data-i18n="innov.reception.p3"></li>
              </ul>
              <a class="btn btn--navy innov-card__cta" href="contact.html" data-i18n="innov.more"></a>
            </div>
            <div class="innov-card__media">
              <img src="assets/img/innov/receptionist.jpg" data-i18n-alt="innov.reception.alt" alt="" />
            </div>
          </article>

          <!-- ================= Innovation backed by experience ================= -->
          <section class="innov-proof" aria-labelledby="proof-title">
            <h2 class="innov-proof__title" id="proof-title" data-i18n="innov.proof.title"></h2>
            <p class="innov-proof__lead" data-i18n="innov.proof.lead"></p>
            <ul class="innov-proof__list">
              <li><img src="assets/icons/dot-red.svg" alt="" aria-hidden="true" /><span data-i18n="innov.proof.1"></span></li>
              <li><img src="assets/icons/dot-red.svg" alt="" aria-hidden="true" /><span data-i18n="innov.proof.2"></span></li>
              <li><img src="assets/icons/dot-red.svg" alt="" aria-hidden="true" /><span data-i18n="innov.proof.3"></span></li>
              <li><img src="assets/icons/dot-red.svg" alt="" aria-hidden="true" /><span data-i18n="innov.proof.4"></span></li>
              <li><img src="assets/icons/dot-red.svg" alt="" aria-hidden="true" /><span data-i18n="innov.proof.5"></span></li>
              <li><img src="assets/icons/dot-red.svg" alt="" aria-hidden="true" /><span data-i18n="innov.proof.6"></span></li>
              <li><img src="assets/icons/dot-red.svg" alt="" aria-hidden="true" /><span data-i18n="innov.proof.7"></span></li>
              <li><img src="assets/icons/dot-red.svg" alt="" aria-hidden="true" /><span data-i18n="innov.proof.8"></span></li>
              <li><img src="assets/icons/dot-red.svg" alt="" aria-hidden="true" /><span data-i18n="innov.proof.9"></span></li>
              <li><img src="assets/icons/dot-red.svg" alt="" aria-hidden="true" /><span data-i18n="innov.proof.10"></span></li>
              <li><img src="assets/icons/dot-red.svg" alt="" aria-hidden="true" /><span data-i18n="innov.proof.11"></span></li>
            </ul>
          </section>
        </div>

        <!-- ================= Encart d'aide ================= -->
        <section class="help" aria-labelledby="help-title">
          <div class="help__panel">
            <div class="help__titles">
              <h2 class="help__title" id="help-title" data-i18n="help.title"></h2>
              <p class="help__lead" data-i18n="innov.helpLead"></p>
            </div>
            <a class="btn btn--navy help__cta" href="contact.html" data-i18n="help.cta"></a>
          </div>
        </section>
      </main>

      <div data-layout="footer"></div>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
