<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Important information — Touchbase</title>
    <meta name="description" content="Touchbase policies, terms of use and support resources, all in one place." />
    <link rel="icon" href="assets/logo-touchbase.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body data-page="info">
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="page">
      <div data-layout="header"></div>

      <main id="main">
        <section class="page-hero" aria-labelledby="page-title">
          <p class="page-hero__eyebrow" data-i18n="info.eyebrow"></p>
          <h1 class="page-hero__title" id="page-title" data-i18n="info.title"></h1>
          <p class="page-hero__lead" data-i18n="info.lead"></p>
        </section>

        <!-- Ce hub donne enfin une destination à l'entrée « Infos importantes » du menu. -->
        <section class="features" aria-label="Important information">
          <nav class="link-list" aria-label="Important information">
            <a class="link-list__item" href="privacy-policy.html">
              <span>
                <span class="link-list__label" data-i18n="footer.privacy"></span>
                <span class="link-list__desc" data-i18n="info.privacyDesc"></span>
              </span>
              <span class="link-list__arrow" aria-hidden="true">→</span>
            </a>

            <a class="link-list__item" href="terms-of-use.html">
              <span>
                <span class="link-list__label" data-i18n="footer.terms"></span>
                <span class="link-list__desc" data-i18n="info.termsDesc"></span>
              </span>
              <span class="link-list__arrow" aria-hidden="true">→</span>
            </a>

            <a
              class="link-list__item"
              href="https://helpcenter.touchbaserealestate.com/"
              target="_blank"
              rel="noopener"
            >
              <span>
                <span class="link-list__label" data-i18n="footer.helpCenter"></span>
                <span class="link-list__desc" data-i18n="info.helpDesc"></span>
              </span>
              <span class="link-list__arrow" aria-hidden="true">→</span>
            </a>

            <a class="link-list__item" href="contact.html">
              <span>
                <span class="link-list__label" data-i18n="footer.contact"></span>
                <span class="link-list__desc" data-i18n="info.contactDesc"></span>
              </span>
              <span class="link-list__arrow" aria-hidden="true">→</span>
            </a>
          </nav>
        </section>
      </main>

      <div data-layout="footer"></div>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
