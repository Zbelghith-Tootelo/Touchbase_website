<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Touchbase for real estate brokerages</title>
    <meta
      name="description"
      content="A powerful messaging system, an admin console and AI-powered innovations — Touchbase brings your whole brokerage onto one platform."
    />
    <link rel="icon" href="assets/logo-touchbase.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body data-page="brokerages">
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="page">
      <div data-layout="header"></div>

      <main id="main">
        <!-- ================= Héros sur photo ================= -->
        <section
          class="aud-hero aud-hero--photo"
          style="--hero-photo: url('assets/img/brokerages/hero-bg.jpg')"
          aria-labelledby="page-title"
        >
          <div class="aud-hero__text">
            <h1 id="page-title">
              <span class="aud-hero__kicker" data-i18n="brkg.kicker"></span>
              <span class="aud-hero__title" data-i18n="brkg.title"></span>
            </h1>
            <div class="aud-hero__lead">
              <p data-i18n="brkg.lead1"></p>
              <p data-i18n="brkg.lead2"></p>
            </div>
            <a class="btn btn--photo-primaire aud-hero__cta" href="contact.html" data-i18n="brkg.cta"></a>
          </div>
          <div class="aud-hero__devices">
            <img src="assets/img/brokerages/hero-devices.png" data-i18n-alt="brkg.heroAlt" alt="" />
          </div>
        </section>

        <!-- ================= Messagerie ================= -->
        <section class="aud-split" aria-labelledby="msg-title">
          <div class="aud-split__text">
            <div class="aud-split__titles">
              <p class="aud-eyebrow" data-i18n="brkg.msg.eyebrow"></p>
              <h2 class="aud-split__title" id="msg-title" data-i18n="brkg.msg.title"></h2>
            </div>
            <ul class="aud-check-list">
              <li>
                <img src="assets/icons/checkmark-square.svg" alt="" aria-hidden="true" />
                <span data-i18n="brkg.msg.1"></span>
              </li>
              <li>
                <img src="assets/icons/checkmark-square.svg" alt="" aria-hidden="true" />
                <span data-i18n="brkg.msg.2"></span>
              </li>
              <li>
                <img src="assets/icons/checkmark-square.svg" alt="" aria-hidden="true" />
                <span data-i18n="brkg.msg.3"></span>
              </li>
            </ul>
            <a class="btn btn--navy" style="--cta-w: 336px" href="contact.html" data-i18n="brkg.msg.cta"></a>
          </div>
          <div class="aud-split__visual" style="--visual-w: 442px">
            <img src="assets/img/brokerages/messaging.png" data-i18n-alt="brkg.msg.alt" alt="" />
          </div>
        </section>

        <!-- ================= 12 fonctionnalités ================= -->
        <section class="aud-grid-section" aria-labelledby="grid-title">
          <div class="aud-grid-section__header">
            <p class="aud-eyebrow" data-i18n="brkg.grid.eyebrow"></p>
            <h2 class="aud-grid-section__title" id="grid-title" data-i18n="brkg.grid.title"></h2>
          </div>

          <div class="aud-grid">
            <article class="aud-grid__item">
              <img src="assets/icons/checkmark-square-grid.svg" alt="" aria-hidden="true" />
              <h3 class="aud-grid__title" data-i18n="brkg.f1.t"></h3>
              <p class="aud-grid__text" data-i18n="brkg.f1.d"></p>
            </article>
            <article class="aud-grid__item">
              <img src="assets/icons/checkmark-square-grid.svg" alt="" aria-hidden="true" />
              <h3 class="aud-grid__title" data-i18n="brkg.f2.t"></h3>
              <p class="aud-grid__text" data-i18n="brkg.f2.d"></p>
            </article>
            <article class="aud-grid__item">
              <img src="assets/icons/checkmark-square-grid.svg" alt="" aria-hidden="true" />
              <h3 class="aud-grid__title" data-i18n="brkg.f3.t"></h3>
              <p class="aud-grid__text" data-i18n="brkg.f3.d"></p>
            </article>
            <article class="aud-grid__item">
              <img src="assets/icons/checkmark-square-grid.svg" alt="" aria-hidden="true" />
              <h3 class="aud-grid__title" data-i18n="brkg.f4.t"></h3>
              <p class="aud-grid__text" data-i18n="brkg.f4.d"></p>
            </article>
            <article class="aud-grid__item">
              <img src="assets/icons/checkmark-square-grid.svg" alt="" aria-hidden="true" />
              <h3 class="aud-grid__title" data-i18n="brkg.f5.t"></h3>
              <p class="aud-grid__text" data-i18n="brkg.f5.d"></p>
            </article>
            <article class="aud-grid__item">
              <img src="assets/icons/checkmark-square-grid.svg" alt="" aria-hidden="true" />
              <h3 class="aud-grid__title" data-i18n="brkg.f6.t"></h3>
              <p class="aud-grid__text" data-i18n="brkg.f6.d"></p>
            </article>
            <article class="aud-grid__item">
              <img src="assets/icons/checkmark-square-grid.svg" alt="" aria-hidden="true" />
              <h3 class="aud-grid__title" data-i18n="brkg.f7.t"></h3>
              <p class="aud-grid__text" data-i18n="brkg.f7.d"></p>
            </article>
            <article class="aud-grid__item">
              <img src="assets/icons/checkmark-square-grid.svg" alt="" aria-hidden="true" />
              <h3 class="aud-grid__title" data-i18n="brkg.f8.t"></h3>
              <p class="aud-grid__text" data-i18n="brkg.f8.d"></p>
            </article>
            <article class="aud-grid__item">
              <img src="assets/icons/checkmark-square-grid.svg" alt="" aria-hidden="true" />
              <h3 class="aud-grid__title" data-i18n="brkg.f9.t"></h3>
              <p class="aud-grid__text" data-i18n="brkg.f9.d"></p>
            </article>
            <article class="aud-grid__item">
              <img src="assets/icons/checkmark-square-grid.svg" alt="" aria-hidden="true" />
              <h3 class="aud-grid__title" data-i18n="brkg.f10.t"></h3>
              <p class="aud-grid__text" data-i18n="brkg.f10.d"></p>
            </article>
            <article class="aud-grid__item">
              <img src="assets/icons/checkmark-square-grid.svg" alt="" aria-hidden="true" />
              <h3 class="aud-grid__title" data-i18n="brkg.f11.t"></h3>
              <p class="aud-grid__text" data-i18n="brkg.f11.d"></p>
            </article>
            <article class="aud-grid__item">
              <img src="assets/icons/checkmark-square-grid.svg" alt="" aria-hidden="true" />
              <h3 class="aud-grid__title" data-i18n="brkg.f12.t"></h3>
              <p class="aud-grid__text" data-i18n="brkg.f12.d"></p>
            </article>
          </div>
        </section>

        <!-- ================= Innovations ================= -->
        <section class="aud-innov" aria-labelledby="innov-title">
          <h2 class="aud-innov__title" id="innov-title" data-i18n="brkg.innovTitle"></h2>

          <article class="innov-card">
            <div class="innov-card__body">
              <h3 class="innov-card__title" data-i18n="brkg.recep.title"></h3>
              <p class="innov-card__subtitle" data-i18n="brkg.recep.subtitle"></p>
              <p class="innov-card__text" data-i18n="brkg.recep.text"></p>
              <ul class="innov-card__points">
                <li data-i18n="brkg.recep.p1"></li>
                <li data-i18n="brkg.recep.p2"></li>
                <li data-i18n="brkg.recep.p3"></li>
              </ul>
              <a class="btn btn--navy innov-card__cta" href="innovations.html" data-i18n="brokers.learnMore"></a>
            </div>
            <div class="innov-card__media">
              <img src="assets/img/brokerages/receptionist.jpg" data-i18n-alt="innov.reception.alt" alt="" />
            </div>
          </article>

          <article class="innov-card">
            <div class="innov-card__body">
              <h3 class="innov-card__title" data-i18n="brkg.rcs.title"></h3>

                <li data-i18n="brkg.rcs.p1"></li>

                <li data-i18n="brkg.rcs.p3"></li>

              <a class="btn btn--navy innov-card__cta" href="innovations.html" data-i18n="brokers.learnMore"></a>
            </div>
            <div class="innov-card__media">
              <img src="assets/img/brokers/rcs.jpg" data-i18n-alt="brokers.rcs.alt" alt="" />
            </div>
          </article>

          <article class="innov-card">
            <div class="innov-card__body">
              <h3 class="innov-card__title" data-i18n="brkg.live.title"></h3>
              <p class="innov-card__subtitle" data-i18n="brkg.live.subtitle"></p>
              <p class="innov-card__text" data-i18n="brkg.live.text"></p>
              <ul class="innov-card__points">

                <li data-i18n="brkg.live.p3"></li>

              <p class="innov-card__subtitle" data-i18n="brkg.auto.subtitle"></p>

            </div>
          </article>
        </section>

        <!-- ================= Built for flexibility ================= -->
        <section class="aud-split aud-split--pad-lg" aria-labelledby="web-title">
          <div class="aud-split__text">
            <div class="aud-split__titles">
              <p class="aud-eyebrow" data-i18n="brkg.web.eyebrow"></p>
              <h2 class="aud-split__title" id="web-title" data-i18n="brkg.web.title"></h2>
              <ul class="aud-plain-list">
                <li data-i18n="brkg.web.1"></li>
                <li data-i18n="brkg.web.2"></li>
                <li data-i18n="brkg.web.3"></li>
                <li data-i18n="brkg.web.4"></li>
                <li data-i18n="brkg.web.5"></li>
                <li data-i18n="brkg.web.6"></li>
                <li data-i18n="brkg.web.7"></li>
                <li data-i18n="brkg.web.8"></li>
              </ul>
            </div>
            <a class="btn btn--navy" style="--cta-w: 281px" href="contact.html" data-i18n="brkg.web.cta"></a>
          </div>
          <div class="aud-split__visual" style="--visual-w: 545px">
            <img src="assets/img/brokerages/web-mockup.png" data-i18n-alt="brkg.web.alt" alt="" />
          </div>
        </section>

        <!-- ================= Encart d'aide ================= -->
        <section class="help" aria-labelledby="help-title">
          <div class="help__panel">
            <div class="help__titles">
              <h2 class="help__title" id="help-title" data-i18n="help.title"></h2>
              <p class="help__lead" data-i18n="innov.helpLead"></p>
            </div>
            <a class="btn btn--navy help__cta" href="contact.html" data-i18n="help.cta"></a>
          </div>
        </section>

      <div data-layout="footer"></div>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>

</html>
