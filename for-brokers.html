<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Touchbase for real estate brokers</title>
    <meta
      name="description"
      content="Touchbase brings showing management, communication and AI-powered innovations together so brokers can spend more time with their clients."
    />
    <link rel="icon" href="assets/logo-touchbase.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body data-page="brokers">
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="page">
      <div data-layout="header"></div>

      <main id="main">
        <!-- ================= Héros ================= -->
        <section class="aud-hero" aria-labelledby="page-title">
          <div class="aud-hero__text">
            <h1 id="page-title">
              <span class="aud-hero__kicker" data-i18n="brokers.kicker"></span>
              <span class="aud-hero__title" data-i18n="brokers.title"></span>
            </h1>
            <div class="aud-hero__lead">
              <p data-i18n="brokers.lead1"></p>
              <p data-i18n="brokers.lead2"></p>
            </div>
            <a class="btn btn--principal aud-hero__cta" href="contact.html" data-i18n="cta.getStarted"></a>
          </div>

          <!-- Le cadre « Animation Test 2 1 » est encore vide dans Figma ; on y place
               la même vidéo que la page Nos innovations, où le calque porte ce nom. -->
          <div class="aud-hero__visual">
            <img src="assets/img/innov/hero-video.jpg" data-i18n-alt="brokers.heroAlt" alt="" />
          </div>
        </section>

        <!-- ================= Trois arguments ================= -->
        <section class="aud-steps" aria-label="What Touchbase simplifies">
          <div class="aud-steps__row">
            <article class="aud-step">
              <h2 class="aud-step__title" data-i18n="brokers.step1.title"></h2>
              <p class="aud-step__text" data-i18n="brokers.step1.text"></p>
            </article>
            <article class="aud-step">
              <h2 class="aud-step__title" data-i18n="brokers.step2.title"></h2>
              <p class="aud-step__text" data-i18n="brokers.step2.text"></p>
            </article>
            <article class="aud-step">
              <h2 class="aud-step__title" data-i18n="brokers.step3.title"></h2>
              <p class="aud-step__text" data-i18n="brokers.step3.text"></p>
            </article>
          </div>
        </section>

        <!-- ================= Innovations ================= -->
        <section class="aud-innov" aria-labelledby="innov-title">
          <h2 class="aud-innov__title" id="innov-title" data-i18n="brokers.innovTitle"></h2>

          <article class="innov-card">
            <div class="innov-card__body">
              <h3 class="innov-card__title" data-i18n="brokers.live.title"></h3>
              <p class="innov-card__subtitle" data-i18n="brokers.live.subtitle"></p>
              <p class="innov-card__text" data-i18n="brokers.live.text"></p>
              <ul class="innov-card__points">
                <li data-i18n="brokers.live.p1"></li>
                <li data-i18n="brokers.live.p2"></li>
                <li data-i18n="brokers.live.p3"></li>
              </ul>
              <a class="btn btn--navy innov-card__cta" href="innovations.html" data-i18n="brokers.learnMore"></a>
            </div>
            <div class="innov-card__media">
              <img src="assets/img/brokers/live.jpg" data-i18n-alt="brokers.live.alt" alt="" />
            </div>
          </article>

          <article class="innov-card">
            <div class="innov-card__body">
              <h3 class="innov-card__title" data-i18n="brokers.rcs.title"></h3>
              <p class="innov-card__subtitle" data-i18n="brokers.rcs.subtitle"></p>
              <p class="innov-card__text" data-i18n="brokers.rcs.text"></p>
              <ul class="innov-card__points">
                <li data-i18n="brokers.rcs.p1"></li>
                <li data-i18n="brokers.rcs.p2"></li>
                <li data-i18n="brokers.rcs.p3"></li>
              </ul>
              <a class="btn btn--navy innov-card__cta" href="innovations.html" data-i18n="brokers.learnMore"></a>
            </div>
            <div class="innov-card__media">
              <img src="assets/img/brokers/rcs.jpg" data-i18n-alt="brokers.rcs.alt" alt="" />
            </div>
          </article>

          <article class="innov-card">
            <div class="innov-card__body">
              <h3 class="innov-card__title" data-i18n="brokers.automaton.title"></h3>
              <p class="innov-card__subtitle" data-i18n="brokers.automaton.subtitle"></p>
              <p class="innov-card__text" data-i18n="brokers.automaton.text"></p>
              <ul class="innov-card__points">
                <li data-i18n="brokers.automaton.p1"></li>
                <li data-i18n="brokers.automaton.p2"></li>
                <li data-i18n="brokers.automaton.p3"></li>
              </ul>
              <a class="btn btn--navy innov-card__cta" href="innovations.html" data-i18n="brokers.learnMore"></a>
            </div>
            <div class="innov-card__media">
              <img src="assets/img/brokers/automaton.jpg" data-i18n-alt="brokers.automaton.alt" alt="" />
            </div>
          </article>
        </section>

        <!-- ================= Features you can rely on ================= -->
        <section class="aud-features" aria-labelledby="features-title">
          <div class="aud-features__text">
            <div>
              <h2 class="aud-features__title" id="features-title" data-i18n="brokers.features.title"></h2>
              <p class="aud-features__lead" data-i18n="brokers.features.lead"></p>
            </div>
            <ul class="aud-features__list">
              <li data-i18n="brokers.features.1"></li>
              <li data-i18n="brokers.features.2"></li>
              <li data-i18n="brokers.features.3"></li>
              <li data-i18n="brokers.features.4"></li>
              <li data-i18n="brokers.features.5"></li>
            </ul>
          </div>
          <div class="aud-features__visual">
            <img src="assets/img/brokers/features.png" data-i18n-alt="brokers.features.alt" alt="" />
          </div>
        </section>

        <!-- ================= Encart d'aide ================= -->
        <section class="help" aria-labelledby="help-title">
          <div class="help__panel">
            <div class="help__titles">
              <h2 class="help__title" id="help-title" data-i18n="help.title"></h2>
              <p class="help__lead" data-i18n="innov.helpLead"></p>
            </div>
            <a class="btn btn--navy help__cta" href="contact.html" data-i18n="help.cta"></a>
          </div>
        </section>
      </main>

      <div data-layout="footer"></div>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
