<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Touchbase for real estate boards</title>
    <meta
      name="description"
      content="Board-wide messaging, auditable court-admissible reports and data hosted in Canada — Touchbase supports real estate boards and their members."
    />
    <link rel="icon" href="assets/logo-touchbase.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body data-page="associations">
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="page innov">
      <div data-layout="header"></div>

      <main id="main">
        <!-- ================= Héros ================= -->
        <section class="aud-hero" aria-labelledby="page-title">
          <div class="aud-hero__text" style="--text-w: 738px">
            <h1 id="page-title">
              <span class="aud-hero__kicker" data-i18n="assoc.kicker"></span>
              <span class="aud-hero__title" data-i18n="assoc.title"></span>
            </h1>
            <div class="aud-hero__lead">
              <p data-i18n="assoc.lead1"></p>
              <p data-i18n="assoc.lead2"></p>
              <p data-i18n="assoc.lead3"></p>
            </div>
          </div>
          <div class="aud-split__visual" style="--visual-w: 442px">
            <img src="assets/img/assoc/hero.png" data-i18n-alt="assoc.heroAlt" alt="" />
          </div>
        </section>

        <!-- ================= Neuf avantages ================= -->
        <section class="aud-benefits" aria-label="Benefits of Touchbase">
          <div class="aud-benefits__grid">
            <article class="benefit-card">
              <span class="benefit-card__icon"><img src="assets/icons/assoc/lock.svg" alt="" aria-hidden="true" /></span>
              <p class="benefit-card__text" data-i18n="assoc.b1"></p>
            </article>
            <article class="benefit-card">
              <span class="benefit-card__icon"
                ><img src="assets/icons/assoc/message-square.svg" alt="" aria-hidden="true"
              /></span>
              <p class="benefit-card__text" data-i18n="assoc.b2"></p>
            </article>
            <article class="benefit-card">
              <span class="benefit-card__icon"
                ><img src="assets/icons/assoc/users.svg" alt="" aria-hidden="true"
              /></span>
              <p class="benefit-card__text" data-i18n="assoc.b3"></p>
            </article>
            <article class="benefit-card">
              <span class="benefit-card__icon"
                ><img src="assets/icons/assoc/clock.svg" alt="" aria-hidden="true"
              /></span>
              <p class="benefit-card__text" data-i18n="assoc.b4"></p>
            </article>
            <article class="benefit-card">
              <span class="benefit-card__icon"
                ><img src="assets/icons/assoc/clipboard-check.svg" alt="" aria-hidden="true"
              /></span>
              <p class="benefit-card__text" data-i18n="assoc.b5"></p>
            </article>
            <article class="benefit-card">
              <span class="benefit-card__icon"
                ><img src="assets/icons/assoc/check-circle.svg" alt="" aria-hidden="true"
              /></span>
              <p class="benefit-card__text" data-i18n="assoc.b6"></p>
            </article>
            <article class="benefit-card">
              <span class="benefit-card__icon"><img src="assets/icons/assoc/star.svg" alt="" aria-hidden="true" /></span>
              <p class="benefit-card__text" data-i18n="assoc.b7"></p>
            </article>
            <article class="benefit-card">
              <span class="benefit-card__icon"
                ><img src="assets/icons/assoc/puzzle.svg" alt="" aria-hidden="true"
              /></span>
              <p class="benefit-card__text" data-i18n="assoc.b8"></p>
            </article>
            <article class="benefit-card">
              <span class="benefit-card__icon"
                ><img src="assets/icons/assoc/sliders.svg" alt="" aria-hidden="true"
              /></span>
              <p class="benefit-card__text" data-i18n="assoc.b9"></p>
            </article>
          </div>

          <a class="btn btn--photo-primaire aud-hero__cta" href="contact.html" data-i18n="cta.getStarted"></a>
        </section>

        <!-- ================= Innovations ================= -->
        <section class="aud-innov" aria-labelledby="innov-title">
          <h2 class="aud-innov__title" id="innov-title" data-i18n="assoc.innovTitle"></h2>

          <article class="innov-card">
            <div class="innov-card__body">
              <h3 class="innov-card__title" data-i18n="assoc.live.title"></h3>
              <p class="innov-card__subtitle" data-i18n="assoc.live.subtitle"></p>
              <p class="innov-card__text" data-i18n="assoc.live.text"></p>
              <ul class="innov-card__points">
                <li data-i18n="assoc.live.p1"></li>
                <li data-i18n="assoc.live.p2"></li>
                <li data-i18n="assoc.live.p3"></li>
              </ul>
              <a class="btn btn--navy innov-card__cta" href="innovations.html" data-i18n="brokers.learnMore"></a>
            </div>
            <div class="innov-card__media">
              <img src="assets/img/innov/live.jpg" data-i18n-alt="innov.live.alt" alt="" />
            </div>
          </article>

          <article class="innov-card">
            <div class="innov-card__body">
              <h3 class="innov-card__title" data-i18n="assoc.rcs.title"></h3>
              <p class="innov-card__subtitle" data-i18n="assoc.rcs.subtitle"></p>
              <p class="innov-card__text" data-i18n="assoc.rcs.text"></p>
              <ul class="innov-card__points">
                <li data-i18n="assoc.rcs.p1"></li>
                <li data-i18n="assoc.rcs.p2"></li>
                <li data-i18n="assoc.rcs.p3"></li>
              </ul>
              <a class="btn btn--navy innov-card__cta" href="innovations.html" data-i18n="brokers.learnMore"></a>
            </div>
            <div class="innov-card__media">
              <img src="assets/img/innov/rcs.jpg" data-i18n-alt="innov.rcs.alt" alt="" />
            </div>
          </article>

          <article class="innov-card">
            <div class="innov-card__body">
              <h3 class="innov-card__title" data-i18n="assoc.auto.title"></h3>
              <p class="innov-card__subtitle" data-i18n="assoc.auto.subtitle"></p>
              <p class="innov-card__text" data-i18n="assoc.auto.text"></p>
              <ul class="innov-card__points">
                <li data-i18n="assoc.auto.p1"></li>
                <li data-i18n="assoc.auto.p2"></li>
                <li data-i18n="assoc.auto.p3"></li>
              </ul>
              <a class="btn btn--navy innov-card__cta" href="innovations.html" data-i18n="brokers.learnMore"></a>
            </div>
            <div class="innov-card__media">
              <img src="assets/img/innov/automaton.jpg" data-i18n-alt="innov.automaton.alt" alt="" />
            </div>
          </article>
        </section>

        <!-- ================= Board-wide messaging ================= -->
        <section class="aud-message" aria-labelledby="msg-title">
          <div class="aud-message__text">
            <div>
              <h2 class="aud-message__title" id="msg-title" data-i18n="assoc.msg.title"></h2>
              <p class="aud-message__subtitle" data-i18n="assoc.msg.subtitle"></p>
            </div>
            <div class="aud-message__body">
              <p data-i18n="assoc.msg.p1"></p>
              <p data-i18n="assoc.msg.p2"></p>
              <p data-i18n="assoc.msg.p3"></p>
            </div>
          </div>
          <div class="aud-message__visual">
            <img src="assets/img/assoc/board.png" data-i18n-alt="assoc.msg.alt" alt="" />
          </div>
        </section>

        <!-- ================= Reports and statistics ================= -->
        <section class="aud-dark" aria-labelledby="reports-title">
          <div class="aud-dark__inner">
            <div class="aud-dark__titles">
              <h2 class="aud-dark__title" id="reports-title" data-i18n="assoc.rep.title"></h2>
              <p class="aud-dark__subtitle" data-i18n="assoc.rep.subtitle"></p>
              <div class="aud-dark__body">
                <p data-i18n="assoc.rep.p1"></p>
                <p data-i18n="assoc.rep.p2"></p>
                <p data-i18n="assoc.rep.p3"></p>
              </div>
            </div>
            <a class="btn btn--photo-secondaire aud-dark__cta" href="contact.html" data-i18n="assoc.rep.cta"></a>
          </div>
        </section>

        <!-- ================= Encart d'aide ================= -->
        <section class="help" aria-labelledby="help-title">
          <div class="help__panel">
            <div class="help__titles">
              <h2 class="help__title" id="help-title" data-i18n="help.title"></h2>
              <p class="help__lead" data-i18n="innov.helpLead"></p>
            </div>
            <a class="btn btn--navy help__cta" href="contact.html" data-i18n="help.cta"></a>
          </div>
        </section>
      </main>

      <div data-layout="footer"></div>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
