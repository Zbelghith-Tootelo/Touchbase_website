<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact us — Touchbase</title>
    <meta
      name="description"
      content="Tell us about your brokerage or real estate board and a Touchbase representative will get back to you within one business day."
    />
    <link rel="icon" href="assets/logo-touchbase.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body data-page="contact">
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="page">
      <div data-layout="header"></div>

      <main id="main">
        <section class="page-hero page-hero--center" aria-labelledby="page-title">
          <p class="page-hero__eyebrow" data-i18n="contact.eyebrow"></p>
          <h1 class="page-hero__title" id="page-title" data-i18n="contact.title"></h1>
          <p class="page-hero__lead" data-i18n="contact.lead"></p>
        </section>

        <div class="contact-layout">
          <!-- Les libellés sont au-dessus des champs, jamais en placeholder seul :
               un placeholder disparaît dès la saisie et n'est pas un libellé. -->
          <form class="contact-form" action="#" method="post" novalidate>
            <p class="contact-form__note" data-i18n="contact.required"></p>

            <div class="field__row">
              <div class="field">
                <label class="field__label" for="first-name">
                  <span data-i18n="contact.firstName"></span> <span class="field__required">*</span>
                </label>
                <input class="field__input" id="first-name" name="firstName" type="text" required />
              </div>
              <div class="field">
                <label class="field__label" for="last-name">
                  <span data-i18n="contact.lastName"></span> <span class="field__required">*</span>
                </label>
                <input class="field__input" id="last-name" name="lastName" type="text" required />
              </div>
            </div>

            <div class="field">
              <label class="field__label" for="email">
                <span data-i18n="contact.email"></span> <span class="field__required">*</span>
              </label>
              <input class="field__input" id="email" name="email" type="email" autocomplete="email" required />
            </div>

            <div class="field">
              <label class="field__label" for="phone" data-i18n="contact.phone"></label>
              <input class="field__input" id="phone" name="phone" type="tel" autocomplete="tel" />
            </div>

            <div class="field">
              <label class="field__label" for="org">
                <span data-i18n="contact.org"></span> <span class="field__required">*</span>
              </label>
              <input class="field__input" id="org" name="organisation" type="text" required />
            </div>

            <div class="field">
              <label class="field__label" for="profile">
                <span data-i18n="contact.profile"></span> <span class="field__required">*</span>
              </label>
              <select class="field__select" id="profile" name="profile" required>
                <option value="" data-i18n="contact.profilePick"></option>
                <option value="broker" data-i18n="contact.profileBroker"></option>
                <option value="brokerage" data-i18n="contact.profileBrokerage"></option>
                <option value="board" data-i18n="contact.profileBoard"></option>
                <option value="buyer" data-i18n="contact.profileBuyer"></option>
              </select>
            </div>

            <div class="field">
              <label class="field__label" for="message">
                <span data-i18n="contact.message"></span> <span class="field__required">*</span>
              </label>
              <textarea
                class="field__textarea"
                id="message"
                name="message"
                data-i18n-placeholder="contact.messagePh"
                required
              ></textarea>
            </div>

            <label class="consent">
              <input type="checkbox" name="consent" required />
              <span data-i18n="contact.consent"></span>
            </label>

            <button class="btn btn--navy contact-form__submit" type="submit" data-i18n="contact.send"></button>
          </form>

          <!-- Une sortie de secours : qui veut juste le numéro ne remplit pas un formulaire. -->
          <aside class="contact-aside">
            <div class="info-card info-card--tinted">
              <p class="info-card__label" data-i18n="contact.supportLabel"></p>
              <a class="info-card__value" href="mailto:support@touchbaserealestate.com"
                >support@touchbaserealestate.com</a
              >
              <a class="info-card__value" href="tel:18004691664">1 (800) 469-1664</a>
            </div>

            <div class="info-card">
              <p class="info-card__label" data-i18n="contact.hoursLabel"></p>
              <p class="info-card__value" data-i18n="contact.hoursDays"></p>
              <p class="info-card__text" data-i18n="contact.hoursTime"></p>
            </div>

            <div class="info-card">
              <p class="info-card__label" data-i18n="contact.selfLabel"></p>
              <a
                class="info-card__value"
                href="https://helpcenter.touchbaserealestate.com/"
                target="_blank"
                rel="noopener"
                data-i18n="contact.selfValue"
              ></a>
              <p class="info-card__text" data-i18n="contact.selfText"></p>
            </div>
          </aside>
        </div>
      </main>

      <div data-layout="footer"></div>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
