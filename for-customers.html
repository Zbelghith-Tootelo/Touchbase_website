<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Touchbase for buyers and sellers</title>
    <meta
      name="description"
      content="Search habits are changing. Touchbase helps Canadian listings surface in AI-powered search, for buyers who look there and sellers who want to be found."
    />
    <link rel="icon" href="assets/logo-touchbase.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body data-page="customers">
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="page innov">
      <div data-layout="header"></div>

      <main id="main">
        <!-- ================= Héros ================= -->
        <section class="cust-hero" aria-labelledby="page-title">
          <div class="cust-hero__text">
            <h1 id="page-title">
              <span class="cust-hero__kicker" data-i18n="cust.kicker"></span>
              <span class="cust-hero__title" data-i18n="cust.title"></span>
            </h1>
            <div class="cust-hero__lead">
              <p data-i18n="cust.lead1"></p>
              <p data-i18n="cust.lead2"></p>
            </div>
          </div>
          <div class="cust-hero__visual">
            <img src="assets/img/customers/hero.jpg" data-i18n-alt="cust.heroAlt" alt="" />
            <p class="cust-hero__bubble" data-i18n="cust.heroBubble"></p>
          </div>
        </section>

        <!-- ================= Pour les acheteurs ================= -->
        <div class="cust-wrap">
          <section class="cust-row" aria-labelledby="buyers-title">
            <div class="cust-row__media">
              <img src="assets/img/customers/buyers.jpg" data-i18n-alt="cust.buyers.alt" alt="" />
            </div>
            <div class="cust-row__text">
              <p class="cust-row__eyebrow" data-i18n="cust.buyers.eyebrow"></p>
              <h2 class="cust-row__title" id="buyers-title" data-i18n="cust.buyers.title"></h2>
              <div class="cust-row__body">
                <p data-i18n="cust.buyers.p1"></p>
                <p data-i18n="cust.buyers.p2"></p>
                <p data-i18n="cust.buyers.p3"></p>
              </div>
            </div>
          </section>

          <!-- ================= Pour les vendeurs ================= -->
          <section class="cust-row" aria-labelledby="sellers-title">
            <div class="cust-row__text">
              <p class="cust-row__eyebrow" data-i18n="cust.sellers.eyebrow"></p>
              <h2 class="cust-row__title" id="sellers-title" data-i18n="cust.sellers.title"></h2>
              <div class="cust-row__body">
                <p data-i18n="cust.sellers.p1"></p>
                <p data-i18n="cust.sellers.p2"></p>
              </div>
            </div>
            <div class="cust-row__media">
              <img src="assets/img/customers/sellers.jpg" data-i18n-alt="cust.sellers.alt" alt="" />
            </div>
          </section>
        </div>

        <!-- ================= Encart d'aide ================= -->
        <section class="help" aria-labelledby="help-title">
          <div class="help__panel">
            <div class="help__titles">
              <h2 class="help__title" id="help-title" data-i18n="help.title"></h2>
              <p class="help__lead" data-i18n="innov.helpLead"></p>
            </div>
            <a class="btn btn--navy help__cta" href="contact.html" data-i18n="help.cta"></a>
          </div>
        </section>
      </main>

      <div data-layout="footer"></div>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
